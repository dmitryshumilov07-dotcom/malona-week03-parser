# Whitelist тестовых запросов. Парсер принимает только эти URL/артикулы.
queries:
  - supplier_id: blum
    article: "71B3550"
    brand: "BLUM"
    url: "https://blum-msk.ru/catalog/demo/71b3550"
    snapshot: "fixtures/pages/blum/71b3550.html"
    expect_status: ok

  - supplier_id: blum
    article: "UNKNOWN-BLUM"
    brand: null
    url: null
    expect_status: not_found

  - supplier_id: blum
    article: "71B3550"
    brand: null
    url: null
